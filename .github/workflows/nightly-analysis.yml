name: Nightly OSM Highway Analysis

on:
  schedule:
    # Run at 7:34 AM UTC every Friday
    - cron: "34 7 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze US States
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy static frontend into gh-pages
        run: |
          mkdir -p gh-pages
          cp -r frontend/. gh-pages/
          rm -f gh-pages/input.css gh-pages/build.sh gh-pages/.tailwindcss-cli
        # Copies the plain HTML/JS site into gh-pages/. style.css is not
        # rebuilt here (see below); the Python step further down overwrites
        # results.json and reports/*.json with real data afterwards.

      - name: Fetch currently-deployed style.css
        run: |
          set -euo pipefail
          IFS='/' read -r owner repo <<< "${{ github.repository }}"
          site_url="https://${owner}.github.io/${repo}"

          echo "Fetching compiled style.css from ${site_url}..."
          if ! curl -sfL "${site_url}/style.css" -o gh-pages/style.css; then
            echo "::warning::Could not fetch style.css from ${site_url}; falling back to the checked-in frontend/style.css."
          fi
        # The frontend-deploy workflow rebuilds and deploys style.css whenever
        # frontend/ changes, so the live site always has the current compiled
        # CSS. Reusing it here avoids rebuilding Tailwind on every nightly run
        # just to reproduce the same output.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install osmium

      - name: Download and analyze US states
        env:
          STATES: alabama alaska arizona arkansas california colorado connecticut delaware district-of-columbia florida georgia hawaii idaho illinois indiana iowa kansas kentucky louisiana maine maryland massachusetts michigan minnesota mississippi missouri montana nebraska nevada new-hampshire new-jersey new-mexico new-york north-carolina north-dakota ohio oklahoma oregon pennsylvania rhode-island south-carolina south-dakota tennessee texas utah vermont virginia washington west-virginia wisconsin wyoming
        run: |
          python scripts/download_and_analyze.py

      - name: Upload analysis results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: gh-pages/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Download analysis results
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
          path: gh-pages

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
