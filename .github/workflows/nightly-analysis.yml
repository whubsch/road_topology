name: Nightly OSM Highway Analysis

on:
  schedule:
    # Run at 7:34 AM UTC every day
    - cron: "34 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze US States
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install osmium

      - name: Create output directory
        run: mkdir -p gh-pages

      - name: Download and analyze US states
        env:
          STATES: alabama alaska arizona arkansas california colorado connecticut delaware district-of-columbia florida georgia hawaii idaho illinois indiana iowa kansas kentucky louisiana maine maryland massachusetts michigan minnesota mississippi missouri montana nebraska nevada new-hampshire new-jersey new-mexico new-york north-carolina north-dakota ohio oklahoma oregon pennsylvania rhode-island south-carolina south-dakota tennessee texas utah vermont virginia washington west-virginia wisconsin wyoming
        run: |
          python scripts/download_and_analyze.py

      - name: Generate homepage
        run: |
          python scripts/generate_homepage.py

      - name: Copy favicon
        run: |
          cp docs/favicon.svg gh-pages/favicon.svg

      - name: Upload analysis results as artifact
        uses: actions/upload-artifact@v7
        with:
          name: analysis-results
          path: gh-pages/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Download analysis results
        uses: actions/download-artifact@v8
        with:
          name: analysis-results
          path: gh-pages

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
