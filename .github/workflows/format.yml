name: Formatter

on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/format.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/format.yml"
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
