name: Formatter

on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/format.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/format.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
